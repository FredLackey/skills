# Managed by easy-reader-terminal/scripts/ghostty/02-apply-profile.sh
# Safe to edit by rerunning the script; local customizations belong in the main
# Ghostty config so they remain outside this managed block.

theme = Dracula

font-family = JetBrainsMonoNL Nerd Font Mono
font-style = Medium
font-size = 18
font-feature = -calt, -liga, -dlig

cursor-style = block
cursor-style-blink = false
shell-integration-features = no-cursor

minimum-contrast = 1.1

window-padding-x = 0
window-padding-y = 0
window-padding-balance = false
window-theme = dark
window-colorspace = srgb

macos-titlebar-style = transparent
